# Written by automated-job-hunter. `hunter upgrade` replaces this file and keeps the schedule.
name: Job hunter

on:
  schedule:
    - cron: "__CRON__"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["profile/**", "config/**"]

permissions:
  contents: write

concurrency:
  group: job-hunter
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No credentials are left on disk: the judging steps below must not be able to push.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Collect
        id: collect
        run: python3 .hunter/engine/hunter.py collect --github-output

      - name: Install Claude Code
        if: steps.collect.outputs.judge_needed == 'true'
        run: npm install -g @anthropic-ai/claude-code@__CLAUDE_CODE_VERSION__

      # Set one repository secret: CLAUDE_CODE_OAUTH_TOKEN (your Claude subscription) or
      # ANTHROPIC_API_KEY (billed per use; create the key inside a workspace). If both are set, the
      # API key is used. No edit to this file is needed. A secret that is not set arrives as an
      # empty string, so each judging step passes on only the one in use, and stops at once when
      # neither is set.
      - name: Judge (triage)
        id: judge_triage
        if: steps.collect.outputs.triage_packets != '0'
        timeout-minutes: 15
        continue-on-error: true
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then export ANTHROPIC_API_KEY="$API_KEY"
          elif [ -n "$OAUTH_TOKEN" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
          else echo "::error::No Claude secret is set. Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY."; exit 1
          fi
          unset API_KEY OAUTH_TOKEN
          sh .hunter/engine/judge.sh

      - name: Advance
        id: advance
        if: steps.collect.outputs.judge_needed == 'true'
        run: python3 .hunter/engine/hunter.py advance --seal "${{ steps.collect.outputs.seal }}" --github-output

      - name: Judge (assess)
        id: judge_assess
        if: steps.advance.outputs.assess_packets != '' && steps.advance.outputs.assess_packets != '0'
        timeout-minutes: 20
        continue-on-error: true
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then export ANTHROPIC_API_KEY="$API_KEY"
          elif [ -n "$OAUTH_TOKEN" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
          else echo "::error::No Claude secret is set. Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY."; exit 1
          fi
          unset API_KEY OAUTH_TOKEN
          sh .hunter/engine/judge.sh

      # Runs even when a judging step failed, so whatever was judged still lands.
      - name: Apply and publish
        if: always() && steps.collect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .hunter/engine/hunter.py apply --seal "${{ steps.advance.outputs.seal || steps.collect.outputs.seal }}"
          python3 .hunter/engine/hunter.py publish

      # A judging step may fail without stopping the run, so that what was judged still lands, but
      # the run must not look like success: fail it here, which also sends GitHub's failure notice.
      - name: Report a failed judging step
        if: always() && (steps.judge_triage.outcome == 'failure' || steps.judge_assess.outcome == 'failure')
        run: |
          echo "::error::A judging step failed; see its log. Postings it did not judge stay queued for the next run."
          exit 1
