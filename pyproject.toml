[project]
name = "automated-job-hunter"
version = "0.1.0"
description = "Agent-driven job radar: a deterministic engine plus cheap subagents keep a private job feed repo up to date."
requires-python = ">=3.9"
# The engine under skills/automated-job-hunter/scripts/ is stdlib-only and is never installed.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/automated-job-hunter/scripts"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PLE", "RUF"]
# SIM905: "a b c".split() is how this code writes word lists.
# RUF001: typographic quotes, dashes and no-break spaces appear on purpose; handling them is the point.
ignore = ["SIM905", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
